name: Offline source checks and review probes
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install test dependency
        shell: pwsh
        run: python -m pip install -r requirements-dev.txt
      - name: Static source tests
        shell: pwsh
        run: python -B -m pytest -q -p no:cacheprovider tests
      - name: Offline review probes in PowerShell 7 (known gaps, not safety certification)
        shell: pwsh
        run: ./tests/identity/Invoke-ReviewProbes.ps1
      - name: Offline review probes in Windows PowerShell 5.1 (known gaps, not safety certification)
        shell: powershell
        run: ./tests/identity/Invoke-ReviewProbes.ps1
      - name: P1 behavioral regression tests in PowerShell 7
        shell: pwsh
        run: ./tests/identity/Invoke-P1SafetyTests.ps1
      - name: P1 behavioral regression tests in Windows PowerShell 5.1
        shell: powershell
        run: ./tests/identity/Invoke-P1SafetyTests.ps1
      - name: Export profile regression tests in PowerShell 7
        shell: pwsh
        run: ./tests/identity/Invoke-ExportTests.ps1
      - name: Export profile regression tests in Windows PowerShell 5.1
        shell: powershell
        run: ./tests/identity/Invoke-ExportTests.ps1

      - name: Workflow helper regressions in PowerShell 7
        shell: pwsh
        run: ./tests/Invoke-WorkflowTests.ps1
      - name: Workflow helper regressions in Windows PowerShell 5.1
        shell: powershell
        run: ./tests/Invoke-WorkflowTests.ps1

      - name: Audit and coverage regressions in PowerShell 7
        shell: pwsh
        run: ./tests/Invoke-AuditCoverageTests.ps1
      - name: Audit and coverage regressions in Windows PowerShell 5.1
        shell: powershell
        run: ./tests/Invoke-AuditCoverageTests.ps1

      - name: Activation and backup regressions in PowerShell 7
        shell: pwsh
        run: ./tests/Invoke-ActivationBackupTests.ps1
      - name: Activation and backup regressions in Windows PowerShell 5.1
        shell: powershell
        run: ./tests/Invoke-ActivationBackupTests.ps1

      - name: TUI regressions in PowerShell 7
        shell: pwsh
        run: ./tests/Invoke-TuiTests.ps1
      - name: TUI regressions in Windows PowerShell 5.1
        shell: powershell
        run: ./tests/Invoke-TuiTests.ps1

      - name: Tenant setup regressions in PowerShell 7
        shell: pwsh
        run: ./tests/Invoke-SetupTests.ps1
      - name: Tenant setup regressions in Windows PowerShell 5.1
        shell: powershell
        run: ./tests/Invoke-SetupTests.ps1
